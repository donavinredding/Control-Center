<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Card Background matching your site cards -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#1e222b" stroke="#3f4a5a" stroke-width="3"/>
  
  <!-- Tech Control Center Ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#61afef" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="5 3"/>
  
  <!-- Monogram 'D' for Donavin -->
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#e2e8f0" text-anchor="middle">D</text>
  
  <!-- Active Tech Status Dot -->
  <circle cx="46" cy="18" r="4" fill="#61afef"/>
</svg>
