<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - My Control Center</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="./images/dcc_icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-brand">
            <img src="./images/dcc_icon.svg" alt="Control Center Icon" class="site-icon" style="width: 36px; height: 36px;">
            <h1>Task Tracker</h1>
        </div>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="snippets.html">Snippets</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html" class="active">Tasks</a>
            <a href="inspiration.html">Inspiration</a>
            <a href="ideas.html">Ideas</a>
            <a href="finance.html">Finance</a>
            <a href="planner.html">Web Planner</a>
        </nav>

        <!-- Reusable Header User Widget -->
        <div id="logout-container" class="header-user-widget" style="display: none;">
            <span id="user-display" class="user-email"></span>
            <button type="button" class="logout-action-btn" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <!-- Authentication Container -->
    <div id="auth-container" class="auth-container-wrapper" style="display: none;">
        <section class="card auth-card-box">
            <h2>🔐 Control Center Access</h2>
            <div class="auth-form-group">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email address..." required autocomplete="email">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password..." required autocomplete="current-password">
                <div class="auth-buttons-row">
                    <button type="button" class="auth-btn login-btn" onclick="handleLogin()">Login</button>
                </div>
                <div id="auth-error" class="auth-error-msg"></div>
            </div>
        </section>
    </div>

    <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
        <section class="card">
            <h2>Current Goals</h2>
            <ul>
                <li>Complete Scrimba JavaScript Course</li>
                <li>Optimize Netlify deployment pipeline</li>
                <li>Set up Fiverr client template system</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Control Center</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
