<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiration Hub - My Control Center</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="./images/dcc_icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="header-brand">
            <img src="./images/dcc_icon.svg" alt="Control Center Icon" class="site-icon" style="width: 36px; height: 36px;">
            <h1>Inspiration Hub</h1>
        </div>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="snippets.html">Snippets</a>
            <a href="projects.html">Projects</a>
            <a href="tasks.html">Tasks</a>
            <a href="inspiration.html" class="active">Inspiration</a>
            <a href="ideas.html">Ideas</a>
            <a href="finance.html">Finance</a>
            <a href="planner.html">Web Planner</a>
        </nav>
        
        <!-- Reusable Header User Widget -->
        <div id="logout-container" class="header-user-widget" style="display: none;">
            <span id="user-display" class="user-email"></span>
            <button type="button" class="logout-action-btn" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <!-- Authentication Container -->
    <div id="auth-container" class="auth-container-wrapper" style="display: none;">
        <section class="card auth-card-box">
            <h2>🔐 Control Center Access</h2>
            <div class="auth-form-group">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email address..." required autocomplete="email">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password..." required autocomplete="current-password">
                <div class="auth-buttons-row">
                    <button type="button" class="auth-btn login-btn" onclick="handleLogin()">Login</button>
                </div>
                <div id="auth-error" class="auth-error-msg"></div>
            </div>
        </section>
    </div>

    <main class="page-block-layout">
        <div class="card">
            <h2>Design Ideas</h2>
            <p>Collect color palettes, UI inspirations, and references here.</p>
            <img src="https://images.unsplash.com/photo-1614726365930-627c75da663e?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="inspiration-img">
            <img src="./images/roomlight.png" class="inspiration-img">
            <img src="https://external-content.duckduckgo.com/iu/?u=http%3A%2F%2Fstatic.planetminecraft.com%2Ffiles%2Fresource_media%2Fscreenshot%2F1216%2Fminecraft-moon-with-shadows_2015078.jpg&f=1&nofb=1&ipt=a86b7fc5a136da72e8f359cdfd49ba2fbc2301e93db6e03d417f4bab3bf47b00" class="inspiration-img">
            <img src="https://plus.unsplash.com/premium_photo-1685697414822-7ce405a00480?q=80&w=447&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="inspiration-img">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fcdn.wionews.com%2Fsites%2Fdefault%2Ffiles%2F2023%2F06%2F08%2F357994-untitled-design-2023-06-08t181038562.png&f=1&nofb=1&ipt=bc403c6f169c592713cd691aeac1f177b4a1427d36d72aa5f3cc758794e61b40" class="inspiration-img">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZpdDR5Y3pmM281ZnpmOGJhMnp6OThzNmltajVoN2RlcHV4OWNqYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eQYRTYYIvnZGdF0tBn/giphy.gif" class="inspiration-img">
            <img src="" class="inspiration-img">
            <img src="" class="inspiration-img">
            <img src="" class="inspiration-img">
            <!-- Code for Image <img src="" class="inspiration-img"> -->
        </div>
            
    </main>

    <footer>
        <p>&copy; 2026 My Control Center</p>
    </footer>

    <script src="script.js"></script>

     <!-- Custom Logout Confirmation Modal -->
    <div id="logout-modal" class="logout-modal-overlay" style="display: none;">
        <div class="card logout-card">
            <h3 class="logout-title">Confirm Logout</h3>
            <p class="logout-desc">Are you sure you want to log out of your Control Center?</p>
            <div class="logout-actions">
                <button type="button" class="auth-btn cancel-btn" onclick="closeLogoutModal()">Cancel</button>
                <button type="button" class="auth-btn login-btn logout-confirm-btn" onclick="confirmLogout()">Log Out</button>
            </div>
        </div>
    </div>
</body>
</html>
